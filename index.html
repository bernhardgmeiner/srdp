<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Don't Panic, It's Just the Matura — the complete interactive B2 writing guide for the Austrian AHS Reifeprüfung in English. All text types, model texts, phrases, quizzes and tools.">
<title>Don't Panic, It's Just the Matura — Writing Guide B2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230f62fe'/><text x='50' y='72' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'>M</text></svg>">
<style>
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:300;font-display:swap;src:url('fonts/ibm-plex-sans-latin-300-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:italic;font-weight:400;font-display:swap;src:url('fonts/ibm-plex-sans-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2')}
/* ─── SITE FOOTER ─── */
.site-footer{border-top:1px solid var(--border);margin-top:64px;padding:38px 0 46px;background:var(--surface-1)}
.site-footer .ftin{max-width:960px;margin:0 auto;padding:0 48px}
.site-footer .ft-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:26px;margin-bottom:22px}
.site-footer .ft-h{font-size:.6875rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.site-footer p{font-size:.8125rem;color:var(--text-secondary);line-height:1.65}
.site-footer a{color:var(--primary);text-decoration:none}
.site-footer a:hover{text-decoration:underline}
.site-footer .ft-base{font-size:.75rem;color:var(--text-muted);border-top:1px solid var(--border);padding-top:16px;line-height:1.6}
@media(max-width:640px){.site-footer .ftin{padding:0 20px}}
/* ─── TOKENS ─────────────────────────────────────────────── */
:root{
  --font-sans:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
}
[data-theme="light"]{
  --bg:#f4f1ea; --surface:#ffffff; --surface-1:#eae6dd; --surface-2:#dcd7cc;
  --border:#e0dcd2; --border-strong:#161616;
  --text:#161616; --text-secondary:#525252; --text-muted:#6f6f6f;
  --hover:#f4f4f4;
  --primary:#0f62fe; --primary-bg:#0f62fe; --primary-fg:#ffffff; --primary-hover:#0050e6; --primary-faint:#edf5ff;
  --blue:#0f62fe; --purple:#8a3ffc; --orange:#a04200; --green:#198038; --red:#da1e28; --yellow:#8e6a00;
  --footer-bg:#161616; --footer-surface:#262626; --footer-ink:#ffffff; --footer-ink-muted:#c6c6c6;
}
[data-theme="dark"]{
  --bg:#161616; --surface:#262626; --surface-1:#2e2e2e; --surface-2:#393939;
  --border:#393939; --border-strong:#f4f4f4;
  --text:#f4f4f4; --text-secondary:#c6c6c6; --text-muted:#a0a0a0;
  --hover:#333333;
  --primary:#78a9ff; --primary-bg:#0f62fe; --primary-fg:#ffffff; --primary-hover:#0353e9; --primary-faint:#1c2a41;
  --blue:#78a9ff; --purple:#be95ff; --orange:#ff832b; --green:#42be65; --red:#fa4d56; --yellow:#f1c21b;
  --footer-bg:#0b0b0b; --footer-surface:#262626; --footer-ink:#ffffff; --footer-ink-muted:#c6c6c6;
}

/* ─── RESET / BASE ───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.5;letter-spacing:.16px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font-family:inherit}
a{color:var(--primary)}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--primary-bg);color:#fff;padding:10px 16px;z-index:1000}
.skip-link:focus{left:0}

/* ─── LAYOUT ─────────────────────────────────────────────── */
#app{display:flex;min-height:100vh}
#main{flex:1;min-width:0;height:100vh;overflow-y:auto}
.page{animation:fadeUp .22s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.wrap{max-width:960px;margin:0 auto;padding:0 48px}
@media(max-width:640px){.wrap{padding:0 20px}}

/* ─── SIDE NAV ───────────────────────────────────────────── */
#sidenav{width:264px;flex-shrink:0;height:100vh;position:sticky;top:0;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:50}
.nav-brand{padding:20px 16px;border-bottom:1px solid var(--border);position:relative}
.nav-brand .t1{font-weight:600;font-size:.9375rem;color:var(--text);line-height:1.3}
.nav-brand .t2{font-size:.75rem;color:var(--text-muted);margin-top:3px;letter-spacing:.32px}
.nav-scroll{flex:1;overflow-y:auto;padding:4px 0 8px}
.nav-divider{padding:18px 16px 6px;font-size:.6875rem;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted);border-top:1px solid var(--border);margin-top:8px}
.nav-divider:first-child{border-top:none;margin-top:0}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;padding:8px 16px;border:none;cursor:pointer;font-size:.875rem;letter-spacing:.16px;background:transparent;color:var(--text-secondary);border-left:3px solid transparent;text-align:left;transition:background .11s,color .11s;text-decoration:none}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--surface-1);color:var(--text);font-weight:600;border-left-color:var(--primary)}
.nav-dot{width:9px;height:9px;flex-shrink:0}
.nav-check{margin-left:auto;font-size:.6875rem;color:var(--green);letter-spacing:.32px}
.theme-toggle{padding:13px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:transparent;border-left:none;border-right:none;border-bottom:none;cursor:pointer;width:100%}
.theme-toggle:hover{background:var(--hover)}
.theme-toggle .lab{font-size:.875rem;color:var(--text-secondary)}
.toggle-track{width:32px;height:16px;border:1px solid var(--border-strong);position:relative;flex-shrink:0}
.toggle-knob{position:absolute;top:2px;left:2px;width:11px;height:11px;background:var(--border-strong);transition:left .15s}
[data-theme="dark"] .toggle-knob{left:17px}

/* ─── MOBILE NAV ─────────────────────────────────────────── */
.mobile-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:100;height:50px;background:var(--bg);border-bottom:1px solid var(--border);padding:0 14px;align-items:center;justify-content:space-between}
.mobile-bar .t1{font-weight:600;font-size:.9rem}
.burger{background:none;border:1px solid var(--border-strong);color:var(--text);font-size:1rem;padding:5px 12px;cursor:pointer}
@media(max-width:840px){
  #sidenav{position:fixed;left:0;top:50px;height:calc(100vh - 50px);transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 16px rgba(0,0,0,.15)}
  #sidenav.open{transform:translateX(0)}
  .mobile-bar{display:flex}
  #main{height:auto;min-height:100vh;padding-top:50px}
  .nav-overlay{position:fixed;inset:50px 0 0 0;background:rgba(0,0,0,.4);z-index:40}
}

/* ─── TYPO BLOCKS ────────────────────────────────────────── */
.page-head{padding:52px 0 0;border-bottom:1px solid var(--border)}
.page-head .inner{max-width:960px;margin:0 auto;padding:0 48px}
@media(max-width:640px){.page-head .inner{padding:0 20px}}
.eyebrow{font-size:.875rem;letter-spacing:.16px;color:var(--text-secondary);margin-bottom:14px;display:flex;align-items:center;gap:10px}
h1.title{font-weight:400;font-size:clamp(1.9rem,4.5vw,3.1rem);line-height:1.18;letter-spacing:-.4px;margin-bottom:12px}
.lead{font-size:1.125rem;color:var(--text-secondary);max-width:620px;line-height:1.55;margin-bottom:30px}
/* H2-level section heading: clearly larger and heavier than body/lead text */
.section-label{font-size:1.3rem;font-weight:600;letter-spacing:-.2px;line-height:1.3;color:var(--text);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
/* H3-level sub heading for inner groups (phrase categories etc.) */
.sub-label{font-size:.8125rem;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--text-muted);margin-bottom:11px}
.gap{height:56px}
.gap-s{height:28px}

/* ─── TABS ───────────────────────────────────────────────── */
.tabs{display:flex;gap:0;flex-wrap:wrap}
.tab{padding:13px 18px;border:none;background:none;cursor:pointer;font-size:.875rem;letter-spacing:.16px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .11s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--primary)}

/* ─── BUTTONS ────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 16px;border-radius:0;font-size:.875rem;font-weight:400;letter-spacing:.16px;line-height:1.29;cursor:pointer;border:1px solid transparent;transition:background .11s,color .11s,border-color .11s;text-align:left;text-decoration:none}
.btn-primary{background:var(--primary-bg);color:var(--primary-fg)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn-ghost:hover{background:var(--primary-faint)}
.btn-sm{padding:6px 12px;font-size:.8125rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ─── CARDS / GRIDS ──────────────────────────────────────── */
.grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border)}
.grid>*{background:var(--surface)}
.g-auto-150{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-auto-220{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g-auto-240{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g-auto-280{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g-2{grid-template-columns:1fr 1fr}
@media(max-width:680px){.g-2{grid-template-columns:1fr}}
.card{padding:22px 24px;text-align:left}
.card.link{cursor:pointer;border:none;font-family:inherit;transition:background .11s;position:relative;display:block;width:100%}
.card.link:hover{background:var(--surface-1)}
.stat-v{font-weight:300;font-size:2.1rem;letter-spacing:-.4px;line-height:1;margin-bottom:8px}
.stat-l{font-size:.875rem;color:var(--text-muted);letter-spacing:.16px}
.go{font-size:.875rem;color:var(--primary);display:flex;align-items:center;gap:8px;margin-top:14px}

/* ─── TIPS / CALLOUTS ────────────────────────────────────── */
.tip{border-left:3px solid var(--primary);background:var(--surface-1);padding:15px 19px;font-size:.9375rem;color:var(--text-secondary);line-height:1.55}
.tip.warn{border-left-color:var(--red)}
.tip.good{border-left-color:var(--green)}
.tip strong{color:var(--text);font-weight:600}
.tip+.tip{margin-top:12px}

/* ─── TABLES ─────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.875rem;min-width:560px}
.tbl th{padding:13px 14px;text-align:left;font-weight:600;color:var(--text);background:var(--surface-1);border-bottom:1px solid var(--border);letter-spacing:.16px}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:top}
.tbl td:first-child{font-weight:600;color:var(--text)}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover{background:var(--surface-1)}
.cell-yes{color:var(--green)!important}
.cell-no{color:var(--text-muted)!important}

/* ─── LAYOUT BOX (text-type skeleton) ────────────────────── */
.layout-box{border:1px solid var(--border);border-left-width:3px;padding:18px 22px;font-family:var(--font-mono);font-size:.8125rem;line-height:2.1;background:var(--surface-1)}
.layout-box .part{color:var(--text);font-weight:500}
.layout-box .note{color:var(--text-muted);font-family:var(--font-sans);margin-left:10px}

/* ─── DO / DON'T ─────────────────────────────────────────── */
.dd-col{padding:20px 24px}
.dd-col.do{border-top:3px solid var(--green)}
.dd-col.dont{border-top:3px solid var(--red)}
.dd-col h3{font-size:.875rem;font-weight:600;margin-bottom:13px}
.dd-col ul{margin:0;padding-left:18px;font-size:.875rem;color:var(--text-secondary);line-height:1.75}
.dd-col li{margin-bottom:5px}

/* ─── MODEL TEXT ANNOTATIONS ─────────────────────────────── */
.model-box{border:1px solid var(--border)}
.model-head{padding:13px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:var(--surface-1)}
.legend{display:flex;gap:16px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text-muted);letter-spacing:.16px}
.legend i{width:10px;height:10px;display:inline-block}
.model-body{padding:26px 30px;font-size:.9375rem;line-height:2.05;background:var(--surface)}
.model-body p{margin-bottom:16px;white-space:pre-line;color:var(--text-secondary)}
mark.ann{padding:1px 2px;color:var(--text);cursor:help;position:relative;background:var(--ann-bg);border-bottom:2px solid var(--ann-c)}
mark.ann .bub{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:.6875rem;padding:4px 9px;white-space:nowrap;z-index:10;pointer-events:none;letter-spacing:.16px}
mark.ann:hover .bub,mark.ann:focus .bub,.show-labels mark.ann .bub{display:block}
@media(max-width:680px){mark.ann .bub{white-space:normal;min-width:160px}.model-body{padding:18px 16px}}

/* ─── PHRASE CHIPS ───────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:.8425rem;font-family:var(--font-mono);cursor:pointer;transition:border-color .11s;text-align:left}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip .ic{font-size:.72rem;color:var(--text-muted)}
.chip.copied{border-color:var(--green);color:var(--green)}
.chip.copied .ic{color:var(--green)}

/* ─── QUIZ ───────────────────────────────────────────────── */
.quiz{max-width:640px}
.qbar{height:4px;background:var(--surface-2);margin-bottom:26px}
.qbar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.875rem;color:var(--text-muted)}
.qq{font-size:1.2rem;margin-bottom:22px;line-height:1.45}
.qopts{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.qopt{padding:14px 16px;border:none;border-left:3px solid transparent;background:var(--surface);color:var(--text-secondary);text-align:left;cursor:pointer;font-size:.9375rem;line-height:1.5}
.qopt:hover:not([disabled]){background:var(--surface-1)}
.qopt b{font-weight:600;margin-right:10px;color:var(--text-muted)}
.qopt.right{border-left-color:var(--green);background:var(--surface-1);color:var(--text)}
.qopt.wrong{border-left-color:var(--red);background:var(--surface-1);color:var(--text)}
.qexpl{margin-top:16px;border-left:3px solid var(--primary);background:var(--surface-1);padding:14px 18px;font-size:.875rem;color:var(--text-secondary);line-height:1.55}
.qscore{font-weight:300;font-size:3.4rem;line-height:1;margin-bottom:8px}
.qmiss{border-left:3px solid var(--red);background:var(--surface-1);padding:15px 19px;margin-bottom:8px;font-size:.875rem;line-height:1.5}

/* ─── DRAG & DROP ────────────────────────────────────────── */
.dnd{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.dnd-item{padding:13px 14px;background:var(--surface);display:flex;align-items:flex-start;gap:10px;border-left:3px solid transparent;cursor:grab}
.dnd-item.dragging{opacity:.4}
.dnd-item.over{border-left-color:var(--primary)}
.dnd-item.right{border-left-color:var(--green)}
.dnd-item.wrong{border-left-color:var(--red)}
.dnd-grip{color:var(--text-muted);user-select:none;flex-shrink:0;margin-top:2px}
.dnd-text{font-size:.9375rem;color:var(--text-secondary);line-height:1.5;white-space:pre-line;flex:1}
.dnd-role{font-size:.8125rem;margin-top:6px}
.dnd-role.ok{color:var(--green)}
.dnd-role.no{color:var(--red)}
.dnd-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.dnd-btns button{border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;font-size:1rem;min-width:44px;min-height:36px;display:flex;align-items:center;justify-content:center;line-height:1}
.dnd-btns button:hover{border-color:var(--border-strong);color:var(--text)}

/* ─── CHECKLIST ──────────────────────────────────────────── */
.cl-item{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:14px 16px;border-top:1px solid var(--border);border-left:3px solid transparent;background:var(--surface)}
.cl-item:first-child{border-top:none}
.cl-item.checked{background:var(--surface-1);border-left-color:var(--green)}
.cl-item.flagged{border-left-color:var(--red)}
.cl-box{width:18px;height:18px;border:1px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff}
.cl-item.checked .cl-box{background:var(--green);border-color:var(--green)}
.cl-text{font-size:.875rem;color:var(--text-secondary);line-height:1.5;flex:1}
.cl-item.checked .cl-text{color:var(--text)}
.hi-pri{margin-left:8px;font-size:.6875rem;color:var(--yellow);border:1px solid var(--yellow);padding:1px 6px;letter-spacing:.16px;white-space:nowrap}

/* ─── FORMS ──────────────────────────────────────────────── */
.field label{display:block;font-size:.75rem;color:var(--text-muted);margin-bottom:8px;letter-spacing:.32px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:none;border-bottom:1px solid var(--border-strong);background:var(--surface-1);color:var(--text);font-size:.9375rem;font-family:var(--font-sans);letter-spacing:.16px}
.field textarea{line-height:1.7;resize:vertical;font-size:.9375rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:-2px}

/* ─── SELF-CHECK FINDINGS ────────────────────────────────── */
.finding{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--border);font-size:.875rem;line-height:1.55;background:var(--surface)}
.finding:first-child{border-top:none}
.finding .fi{flex-shrink:0;width:18px;text-align:center;font-weight:600}
.finding.ok .fi{color:var(--green)}
.finding.warn .fi{color:var(--yellow)}
.finding.bad .fi{color:var(--red)}
.finding.info .fi{color:var(--primary)}
.finding .ft{color:var(--text-secondary)}
.finding .ft b{color:var(--text);font-weight:600}
.finding .ft code{font-family:var(--font-mono);font-size:.8125rem;background:var(--surface-1);padding:1px 5px}

/* ─── PEEL / PARAGRAPH ───────────────────────────────────── */
.peel-card{border:1px solid var(--border);border-top:2px solid var(--pc);padding:16px 18px;background:var(--surface)}
.peel-card .pn{font-size:1rem;color:var(--pc);margin-right:8px}
.peel-card .pl{font-size:.7rem;letter-spacing:.09em;color:var(--pc);font-weight:600}
.peel-card .pd{font-size:.84rem;color:var(--text-secondary);line-height:1.65;margin-top:8px}
mark.peel{padding:1px 3px;color:var(--text);margin-right:4px;background:var(--ann-bg);border-bottom:1.5px solid var(--ann-c)}
.wa-row{border:1px solid var(--border);border-left:2px solid var(--pc);display:flex;background:var(--surface)}
.wa-side{width:118px;padding:12px 13px;border-right:1px solid var(--border);background:var(--surface-1);flex-shrink:0;display:flex;flex-direction:column;justify-content:center}
.wa-side .pn{font-size:.95rem;color:var(--pc)}
.wa-side .pl{font-size:.6rem;letter-spacing:.07em;color:var(--pc);font-weight:600;line-height:1.35;margin-top:3px}
.wa-row textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:.875rem;font-family:var(--font-sans);line-height:1.6;padding:12px 15px;resize:vertical;outline:none;min-height:54px}
.wa-row textarea:focus{outline:2px solid var(--primary);outline-offset:-2px}
@media(max-width:560px){.wa-side{width:84px}}

/* ─── SPOT THE MISTAKES / MONO TEXT ──────────────────────── */
.mono-text{padding:20px 24px;font-family:var(--font-mono);font-size:.8125rem;line-height:1.9;white-space:pre-wrap;color:var(--text-secondary)}
.err-row{display:flex;gap:12px;padding:12px 16px;border-left:3px solid var(--red);background:var(--surface-1);margin-bottom:1px;font-size:.875rem;line-height:1.5}
.err-row .n{color:var(--red);font-weight:600;flex-shrink:0}
.err-row .m{font-family:var(--font-mono);color:var(--red)}
.err-row .f{color:var(--text-secondary)}

.day-row{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--border)}
.day-row:first-child{border-top:none}
.day-row .d{padding:15px 16px;background:var(--surface-1);border-right:1px solid var(--border);font-weight:600;font-size:.875rem;display:flex;align-items:center}
.day-row .c{padding:15px 18px;font-size:.875rem;color:var(--text-secondary);line-height:1.6}

/* ─── ACCORDION ──────────────────────────────────────────── */
.acc{border:1px solid var(--border)}
.acc-head{width:100%;display:flex;align-items:center;gap:14px;padding:15px 22px;background:var(--surface);border:none;border-top:1px solid var(--border);cursor:pointer;text-align:left;font-size:.9575rem;font-weight:600;color:var(--text)}
.acc>div:first-child .acc-head{border-top:none}
.acc-head:hover{background:var(--surface-1)}
.acc-head .pm{color:var(--primary);font-size:1rem;transition:transform .15s;display:inline-block}
.acc-item.open .acc-head .pm{transform:rotate(45deg)}
.acc-head .sub{margin-left:auto;font-size:.75rem;color:var(--text-muted);font-weight:400}
.acc-body{display:none;padding:6px 24px 26px;background:var(--surface-1)}
.acc-item.open .acc-body{display:block}

/* ─── MISC ───────────────────────────────────────────────── */
.pair-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
@media(max-width:640px){.pair-row{grid-template-columns:1fr}}
.pair-cell{background:var(--surface);padding:13px 16px;font-size:.875rem;line-height:1.6}
.pair-cell .lab{font-size:.6875rem;letter-spacing:.5px;font-weight:600;margin-bottom:5px}
.wrong-c{color:var(--red)}
.right-c{color:var(--green)}
.badge{font-size:.6875rem;color:var(--text-muted);border:1px solid var(--border);padding:2px 8px;letter-spacing:.32px;white-space:nowrap}
.kbd{font-family:var(--font-mono);font-size:.8125rem;background:var(--surface-1);border:1px solid var(--border);padding:1px 6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-2)}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;font-size:.875rem;z-index:500;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ─── GUIDED TOUR ────────────────────────────────────────── */
.tour-catch{position:fixed;inset:0;z-index:7999;display:none}
.tour-spot{position:fixed;z-index:8000;border-radius:4px;box-shadow:0 0 0 3px var(--primary),0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;transition:top .2s,left .2s,width .2s,height .2s;display:none}
.tour-card{position:fixed;z-index:8001;width:330px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border-strong);box-shadow:0 14px 44px rgba(0,0,0,.32);padding:20px 22px;display:none}
.tour-card .tc-step{font-size:.75rem;letter-spacing:.32px;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px}
.tour-card .tc-title{font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:9px;line-height:1.3}
.tour-card .tc-text{font-size:.9rem;color:var(--text-secondary);line-height:1.55;margin-bottom:18px}
.tour-card .tc-btns{display:flex;align-items:center;gap:8px}
.tour-card .tc-skip{margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:.8125rem;cursor:pointer;text-decoration:underline;padding:4px}
body.tour-on{overflow:hidden}
.nav-help{background:none;border:1px solid var(--border-strong);color:var(--text-secondary);width:25px;height:25px;border-radius:50%;cursor:pointer;font-size:.8125rem;line-height:1;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.nav-help:hover{background:var(--hover);color:var(--text)}
.nav-help.pulse{border-color:var(--primary);color:var(--primary);animation:helpPulse 1.5s ease-out 3}
@keyframes helpPulse{0%{box-shadow:0 0 0 0 rgba(15,98,254,.45)}70%{box-shadow:0 0 0 9px rgba(15,98,254,0)}100%{box-shadow:0 0 0 0 rgba(15,98,254,0)}}
.nav-hint{position:absolute;top:54px;right:14px;z-index:60;background:var(--primary);color:#fff;font-size:.75rem;line-height:1.4;padding:9px 12px;max-width:185px;box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer;animation:hintIn .25s ease-out}
.nav-hint::after{content:"";position:absolute;top:-6px;right:12px;border:6px solid transparent;border-bottom-color:var(--primary);border-top:0}
.nav-hint b{display:block;font-weight:600;margin-bottom:1px}
@keyframes hintIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
/* ─── PRINT ──────────────────────────────────────────────── */
@media print{
  #sidenav,.mobile-bar,.no-print,.tabs,#tourCatch,#tourSpot,#tourCard,.toast{display:none!important}
  body{background:#fff;color:#000;font-size:10.5pt}
  #app{display:block}
  #main{height:auto;overflow:visible}
  .page-head{padding-top:0}
  mark.ann .bub{display:none!important}
}
</style>

/* ════════════════════════════════════════════════════════════

(function () {
'use strict';

/* ─── helpers ─────────────────────────────────────────────── */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const TYPE_COLORS = { purple: 'var(--purple)', blue: 'var(--blue)', orange: 'var(--orange)', green: 'var(--green)', red: 'var(--red)' };
const ANN = {
  structure: { c: 'var(--blue)', label: 'Structure' },
  content:   { c: 'var(--green)', label: 'Content' },
  language:  { c: 'var(--yellow)', label: 'Language' },
  special:   { c: 'var(--purple)', label: 'Text-specific' },
};
const PEEL = { point: 'var(--blue)', explain: 'var(--green)', evidence: 'var(--yellow)', closing: 'var(--purple)' };

function store(key, val) {
  try { if (val === undefined) { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; }
}
let progress = store('mwg_progress') || {};
function markVisited(id) { progress[id] = Object.assign({}, progress[id], { visited: true }); store('mwg_progress', progress); paintNav(); }
function markQuiz(id) { progress[id] = Object.assign({}, progress[id], { quiz: true }); store('mwg_progress', progress); paintNav(); }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1500);
}
function copyText(text, onDone) {
  const done = () => { toast('Copied to clipboard'); onDone && onDone(); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed — select and copy manually'); }
  document.body.removeChild(ta);
}

/* annotated paragraph → HTML */
function annotated(para) {
  if (!para.annotations || !para.annotations.length) return '<p>' + esc(para.text) + '</p>';
  let parts = [{ text: para.text, type: null }];
  para.annotations.forEach(ann => {
    parts = parts.flatMap(part => {
      if (part.type !== null || part.text.indexOf(ann.span) === -1) return [part];
      const i = part.text.indexOf(ann.span);
      return [
        { text: part.text.slice(0, i), type: null },
        { text: ann.span, type: ann.type, label: ann.label },
        { text: part.text.slice(i + ann.span.length), type: null },
      ].filter(p => p.text);
    });
  });
  const inner = parts.map(p => {
    if (!p.type) return esc(p.text);
    const a = ANN[p.type] || ANN.language;
    return '<mark class="ann" tabindex="0" style="--ann-c:' + a.c + ';--ann-bg:color-mix(in srgb,' + a.c + ' 15%,transparent)">' +
      esc(p.text) + '<span class="bub">' + esc(p.label) + '</span></mark>';
  }).join('');
  return '<p' + (para.isHeader ? ' style="font-family:var(--font-mono);font-size:.8125rem;line-height:1.8"' : '') + '>' + inner + '</p>';
}
function modelBox(model, extraNote) {
  return (
    '<div class="model-box">' +
      '<div class="model-head"><div class="legend">' +
        Object.keys(ANN).map(k => '<span><i style="background:color-mix(in srgb,' + ANN[k].c + ' 22%,transparent);border-bottom:2px solid ' + ANN[k].c + '"></i>' + ANN[k].label + '</span>').join('') +
      '</div><button class="btn btn-ghost btn-sm" data-action="toggle-labels">Show all labels</button></div>' +
      '<div class="model-body">' + model.paragraphs.map(annotated).join('') + '</div>' +
    '</div>' +
    '<div style="margin-top:11px;font-size:.75rem;color:var(--text-muted);letter-spacing:.32px">' +
      (extraNote || 'Hover (or tap) any highlighted passage to see its role. ' + esc(model.wordCount) + ' words · ' + esc(model.register) + ' register.') +
    '</div>'
  );
}
function sectionLabel(t) { return '<h2 class="section-label">' + t + '</h2>'; }
function pageHead(eyebrow, title, lead, extra) {

    '<div class="eyebrow">' + eyebrow + '</div>' +
    '<h1 class="title">' + title + '</h1>' +
    (lead ? '<p class="lead">' + lead + '</p>' : '') +
    (extra || '<div style="height:26px"></div>') +
  '</div></div>';
}
function ddCols(dos, donts) {
  return '<div class="grid g-2">' +
    '<div class="dd-col do"><h3>Do</h3><ul>' + dos.map(d => '<li>' + esc(d) + '</li>').join('') + '</ul></div>' +
    '<div class="dd-col dont"><h3>Don&rsquo;t</h3><ul>' + donts.map(d => '<li>' + esc(d) + '</li>').join('') + '</ul></div>' +
  '</div>';
}
function chips(items, prefix) {
  return '<div class="chips">' + items.map(p =>
    '<button class="chip" data-copy="' + esc(p) + '"><span class="ic">⧉</span><span>' + esc(p) + '</span></button>'
  ).join('') + '</div>';
}
function phraseGroups(groups) {
  return groups.map(g => '<div style="margin-bottom:30px"><h3 class="sub-label">' + esc(g.category || g.label) + '</h3>' + chips(g.items || g.phrases) + '</div>').join('');

/* ─── generic quiz engine ─────────────────────────────────── */
const quizStates = {};
function quizHTML(qid) {
  const st = quizStates[qid];
  const qs = st.questions;
  if (st.done) {
    const score = st.answers.filter(a => a.correct).length;
    const misses = st.answers.filter(a => !a.correct);
    return '<div class="quiz">' +

      '</div>' +
      misses.map(a => {
        const q = qs[a.q];
        return '<div class="qmiss"><div style="font-weight:600;color:var(--text);margin-bottom:8px">' + esc(q.q) + '</div>' +
          '<div style="color:var(--red);margin-bottom:4px">✗ You chose: ' + esc(q.options[a.chosen]) + '</div>' +
          '<div style="color:var(--green);margin-bottom:8px">✓ Correct: ' + esc(q.options[q.correct]) + '</div>' +
          '<div style="color:var(--text-muted)">' + esc(q.explanation) + '</div></div>';
      }).join('') +
      '<button class="btn btn-ghost" style="margin-top:14px" data-action="quiz-restart" data-quiz="' + qid + '">Retake quiz</button>' +
    '</div>';
  }
  const q = qs[st.current];
  const sel = st.selected;
  return '<div class="quiz">' +
    '<div class="qmeta"><span>Question ' + (st.current + 1) + ' of ' + qs.length + '</span><span>' + Math.round((st.current / qs.length) * 100) + '%</span></div>' +
    '<div class="qbar"><i style="width:' + (st.current / qs.length) * 100 + '%"></i></div>' +

function initQuiz(qid, questions, onComplete) {
  quizStates[qid] = { questions, current: 0, selected: null, answers: [], done: false, onComplete };
}
function quizAction(action, qid, i) {
  const st = quizStates[qid]; if (!st) return;
  if (action === 'quiz-pick' && st.selected === null) {
    st.selected = i;
    st.answers.push({ q: st.current, chosen: i, correct: i === st.questions[st.current].correct });
  } else if (action === 'quiz-next') {
    if (st.current < st.questions.length - 1) { st.current++; st.selected = null; }
    else { st.done = true; st.onComplete && st.onComplete(st.answers.filter(a => a.correct).length, st.questions.length); }
  } else if (action === 'quiz-restart') {
    st.current = 0; st.selected = null; st.answers = []; st.done = false;
  }
  const host = $('[data-quiz-host="' + qid + '"]');
  if (host) host.innerHTML = quizHTML(qid);

/* ─── drag & drop engine ──────────────────────────────────── */
const dndStates = {};
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function initDnd(did, items) {
  const withOrder = items.map((it, i) => Object.assign({}, it, { order: i }));
  let sh = shuffle(withOrder);
  if (sh.every((s, i) => s.order === i)) sh = shuffle(withOrder); // avoid trivially solved
  dndStates[did] = { items: withOrder, shuffled: sh, checked: false };
}
function dndHTML(did) {
  const st = dndStates[did];
  return '<div class="dnd" data-dnd="' + did + '">' + st.shuffled.map((s, i) => {
    const ok = st.checked && s.order === i, no = st.checked && s.order !== i;
    return '<div class="dnd-item' + (ok ? ' right' : '') + (no ? ' wrong' : '') + '" draggable="true" data-i="' + i + '">' +
      '<span class="dnd-grip" aria-hidden="true">⠿</span>' +
      '<div class="dnd-text">' + esc(s.text) +
        (st.checked ? '<div class="dnd-role ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' + esc(s.role) : '✗ This position needs: ' + esc(st.items[i].role)) + '</div>' : '') +
      '</div>' +
      '<div class="dnd-btns no-print"><button data-action="dnd-up" data-dnd="' + did + '" data-i="' + i + '" aria-label="Move up">▲</button><button data-action="dnd-down" data-dnd="' + did + '" data-i="' + i + '" aria-label="Move down">▼</button></div>' +
    '</div>';
  }).join('') + '</div>' +
  '<div style="margin-top:18px;display:flex;gap:8px">' +
    (!st.checked
      ? '<button class="btn btn-primary" data-action="dnd-check" data-dnd="' + did + '">Check order</button>'
      : '<button class="btn btn-ghost" data-action="dnd-retry" data-dnd="' + did + '">Shuffle &amp; try again</button>') +
  '</div>';
}
function repaintDnd(did) {
  const host = $('[data-dnd-host="' + did + '"]');
  if (host) { host.innerHTML = dndHTML(did); wireDnd(did); }
}
function wireDnd(did) {
  const st = dndStates[did];
  const list = $('[data-dnd="' + did + '"]');
  if (!list) return;
  let dragIdx = null;
  $$('.dnd-item', list).forEach(el => {
    el.addEventListener('dragstart', () => { dragIdx = +el.dataset.i; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { dragIdx = null; el.classList.remove('dragging'); });
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      const to = +el.dataset.i;
      if (dragIdx === null || dragIdx === to) return;
      const arr = st.shuffled;
      const [m] = arr.splice(dragIdx, 1);
      arr.splice(to, 0, m);
      st.checked = false;
      repaintDnd(did);
    });
  });
}

        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mistake</th><th>What it costs</th><th>The fix</th></tr></thead><tbody>' +
          [
            ['Writing only 2 of 3 bullet points', 'Task Achievement drops sharply', 'Tick off each bullet as you write it'],
            ['Wrong text type conventions', 'e.g. no headings in a report', 'Check the layout box before starting'],
            ['Copying words from the prompt', 'Range drops', 'Rephrase the task&rsquo;s words — use synonyms'],
            ['Word count off by more than ±10%', 'Task Achievement drops one band', 'Count your words. Practise estimating.'],
            ['Essay style in a blog (or vice versa)', 'Wrong register = lower Task Achievement', 'Ask: formal or informal? Then commit.'],
            ['Only simple linking words', 'Low Coherence score', 'Use the B2 linking words table'],
            ['No topic sentences', 'Paragraphs feel random, weak Coherence', 'First sentence of each paragraph = the point'],
            ['Forgetting to proofread', 'Errors you would catch in 3 minutes', 'Always save 5–10 min at the end'],
          ].map(r => '<tr><td>' + r[0] + '</td><td style="color:var(--red)">' + r[1] + '</td><td>→ ' + r[2] + '</td></tr>').join('') +
        '</tbody></table></div>' +
        '<div style="height:72px"></div>' +
      '</div>' +
    '</div>';
  },
};

/* ─── TEXT TYPE PAGES ─────────────────────────────────────── */
const typeTabs = {};
const TYPE_EXAMPLES = {
  essay: { weak: 'Social media has many advantages and disadvantages for young people today.', strong: 'For teenagers, the real cost of social media is not screen time. It is a slowly shrinking attention span.', why: 'A strong essay opens each paragraph with one clear, arguable point. The weaker version lists everything and commits to nothing, so the examiner cannot follow your line of argument.' },
  article: { weak: 'In this article I am going to tell you about the advantages of doing sport.', strong: 'Ask anyone who has hit the wall at kilometre 30: running is at least half a mental game.', why: 'An article has to pull the reader in. Announcing your plan reads flat, while a concrete hook makes someone want to read on. That is exactly what the task rewards.' },
  report: { weak: 'I really think the school canteen is terrible and nobody likes it.', strong: 'Under heading 2, Findings: 68 per cent of the 120 students surveyed rated the canteen food as poor or very poor.', why: 'A report stays factual and impersonal and presents its evidence under numbered headings. Personal outbursts cost you marks for register and task achievement.' },
  blog: { weak: 'One should carefully consider the various advantages before deciding to take a gap year.', strong: 'I used to think a gap year was just an expensive way to put off real life. Then I took one, and it changed my mind.', why: 'Blogs work through a personal, informal voice with contractions and a short story. Formal phrasing like one should consider is essay register dropped into the wrong text type.' },
  email: { weak: 'Hi! Your headphones broke after two days and I want my money back, thanks.', strong: 'Dear Sir or Madam, I am writing to request a refund for the headphones I bought on 3 May, which stopped working after two days.', why: 'A formal email names its purpose in the first line and keeps a polite, formal register throughout. The casual version would be marked down for register and tone.' },
};
const SECOND_MODELS = {
  essay: { title:'Should smartphones be banned in schools?', meta:'~400 words · formal', tip:'This second example has no colour labels on purpose. Try to spot the thesis in the introduction, the topic sentence of each body paragraph, the counter-argument and the forward-looking conclusion yourself.', paras:[{ t:'Walk into any schoolyard during a break and you will see the same picture: rows of students staring silently at their screens. Some teachers and parents argue that smartphones have no place in education and should be banned outright. In my opinion, a complete ban is the wrong answer; schools should teach students to use these devices responsibly instead.', mono:false },{ t:'There is no denying that smartphones can be a serious distraction. Notifications interrupt concentration, social media tempts students during lessons, and cheating in tests has become easier than ever. Research suggests that pupils who are separated from their phones often perform better in exams and remember more of what they learn. Beyond the classroom, there is growing concern about the effect of constant connectivity on sleep and attention spans. For younger children in particular, the endless pull of games and messages can make focused learning almost impossible.', mono:false },{ t:'However, banning smartphones completely ignores their enormous educational potential. A phone is also a dictionary, a research tool, a calculator and a way into learning apps that would otherwise be out of reach. Used well, it can record an experiment, translate an unfamiliar word in seconds, or remind a forgetful teenager when an assignment is due. Forbidding the device does not teach self-control; it simply postpones the moment when young people have to manage it on their own. In a world where digital skills are essential, schools that ban phones may leave their students unprepared.', mono:false },{ t:'A more sensible approach lies somewhere in the middle. Phones could be switched off and stored away during lessons, but brought out deliberately for specific tasks such as research or quizzes. Teachers also need clear, shared guidelines, so that the same rules apply in every classroom rather than depending on who happens to be on duty. Rules agreed on together with the students are far more effective than a blanket ban that pupils will only try to get around. Above all, a thoughtful policy treats students as young adults who can learn responsibility, instead of treating them like a problem to be switched off.', mono:false },{ t:'All things considered, smartphones are not the enemy of education, but they are not a magic solution either. The real challenge is the way we teach young people to use them, not the technology itself. Schools that manage this will give their students a skill that lasts far longer than any exam.', mono:false }] },
  article: { title:'Why learning a language is worth the struggle', meta:'~250 words · semi-formal', tip:'This second example has no colour labels. Try to spot the catchy opening question, the personal voice, and the way each paragraph develops one clear idea yourself.', paras:[{ t:'Have you ever given up on a language because the grammar felt impossible? You are not alone. But after spending a summer working in Italy with barely any Italian, I am convinced that pushing through the hard part is one of the most rewarding things a teenager can do.', mono:false },{ t:'The obvious benefit is communication. Once I could order food, ask for directions and joke with my colleagues, a whole country opened up to me. Suddenly I was not just a tourist staring helplessly at a menu. Now I could actually take part. I will never forget the afternoon an elderly shopkeeper, delighted that a foreigner was even trying, spent twenty minutes teaching me the local word for delicious. That single afternoon taught me more than a month of vocabulary lists ever could.', mono:false },{ t:'What surprised me more, though, was what it did to my confidence. Every small conversation I survived made the next one a little easier. I slowly realised that making mistakes was not really embarrassing. It was just part of the process. By the end of the summer, the language had stopped feeling like a school subject and started feeling like a tool I actually owned.', mono:false },{ t:'So if you are ever tempted to quit, my advice is simple: keep going, and look for chances to use the language in real life, even when it feels awkward. The struggle is temporary, but the doors a second language opens stay open for good.', mono:false }] },
  report: { title:'Report on the use of the school library', meta:'~250 words · formal', tip:'This second example has no colour labels. Try to spot the header, the numbered sections, the precise data and the clear recommendations yourself.', paras:[{ t:'Date: 8 May 2026\nFrom: Tom Pichler, Student Council\nSubject: Survey on the Use of the School Library', mono:true },{ t:'1. Introduction\nThis report presents the results of a survey on how students use the school library. A total of 110 students from years 9 to 12 took part. The aim is to find out why the library is so often empty and to suggest practical improvements.', mono:false },{ t:'2. Findings\nThe results were revealing. While 78% of respondents said they valued having a library, only 21% visited it more than once a month. The main reasons given were limited opening hours and a lack of quiet study space. Interestingly, students in the upper years were far more likely to use the library than younger ones, who tended to study at home. In addition, many were unaware that e-books could be borrowed free of charge.', mono:false },{ t:'3. Recommendations\nOn the basis of these findings, it would be advisable to extend the opening hours into the early afternoon and to create a separate silent study area. Furthermore, the e-book service should be promoted more actively, for example through posters and a short presentation in each class. It would also be worth repeating the survey after one term to measure the effect.', mono:false },{ t:'4. Conclusion\nIn summary, students clearly value the library but rarely use it. With longer hours, a dedicated quiet zone and better promotion, it could once again become a valuable part of school life.', mono:false }] },
  blog: { title:'What three months without takeaway taught me', meta:'~250 words · informal', tip:'This second example has no colour labels. Try to spot the username line, the chatty personal voice, the short punchy sentences and the call to comment yourself.', paras:[{ t:'by leo_cooks · 14 April 2026, 18:20\n\nWhat Three Months Without Takeaway Taught Me', mono:true },{ t:'OK, confession time: I used to order food about four times a week. Pizza, sushi, burgers, you name it. So when my mum challenged me to cook every single meal myself for three months, I genuinely thought I would starve. My friends were just as sceptical. One of them actually offered to order for me in case of emergencies, as if a home-cooked dinner were some kind of survival situation. Spoiler: I did not starve.', mono:false },{ t:'The first week was rough. I burnt rice, undercooked chicken and somehow set off the smoke alarm twice. But here is the thing nobody tells you: cooking gets easier scarily fast. By week three I could throw together a curry without even checking the recipe, and it actually tasted good. Somewhere around week six, I even started to enjoy it. There is something weirdly satisfying about eating a meal you made with your own two hands, even if half of it is slightly burnt.', mono:false },{ t:'The biggest surprise, though, was not the food. It was the money. I worked out that I had saved almost 200 euros, just by not tapping that little delivery button. So, am I never ordering takeaway again? Of course not. But now it feels like a treat instead of a lazy default. Have you ever tried a challenge like this? Tell me how it went in the comments!', mono:false }] },
  email: { title:'Complaint about a faulty online order', meta:'~250 words · formal', tip:'This second example has no colour labels. Try to spot the four-part header, the formal greeting, the specific complaint, the clear request and the matching sign-off yourself.', paras:[{ t:'To: support@techstore.example\nFrom: julia.berger@email.example\nDate: 22 April 2026\nSubject: Faulty Wireless Headphones (Order #48217)', mono:true },{ t:'Dear Sir or Madam,\n\nI am writing to complain about a pair of wireless headphones I ordered from your website on 5 April. Although the product was advertised as new and fully functional, it developed a serious fault within only three days of use. As I had been looking forward to using them for my daily commute, the disappointment was considerable.', mono:false },{ t:'To be specific, the right earpiece stopped working completely, and the battery now lasts barely an hour despite a full charge. I have carefully followed the troubleshooting steps on your website, but unfortunately none of them solved the problem. I should add that this is the second item from your shop to develop a fault within a month, which has understandably shaken my confidence in the products you sell. Naturally, I expected an item advertised as new to last considerably longer than a few days of normal use.', mono:false },{ t:'As the headphones are clearly defective, I would therefore like to request either a full refund or a replacement of the same model. Given that the order is still well within its warranty period, I trust this can be resolved quickly. I have attached a copy of my order confirmation and look forward to your reply within 14 days.\n\nYours faithfully,\nJulia Berger', mono:false }] },
};
function secondModelBox(m) {

    '<div class="acc"><div class="acc-item"><button class="acc-head" data-action="acc" aria-expanded="false"><span class="pm">+</span><span>A second model text (a different topic)</span></button>' +
    '<div class="acc-body">' +
      '<div style="font-weight:600;font-size:.95rem;margin:12px 0 3px">' + esc(m.title) + '</div>' +
      '<div style="font-size:.75rem;color:var(--text-muted);margin-bottom:14px;letter-spacing:.32px">' + esc(m.meta) + '</div>' +
      '<div style="font-size:.95rem;line-height:1.65;color:var(--text)">' + m.paras.map(function(p){ return '<p style="margin-bottom:12px' + (p.mono ? ';font-family:var(--font-mono);font-size:.8125rem;line-height:1.8' : '') + '">' + esc(p.t).replace(/\n/g, '<br>') + '</p>'; }).join('') + '</div>' +
      '<div class="tip" style="margin-top:14px">' + esc(m.tip) + '</div>' +
    '</div></div></div>';
}

function typePage(typeId) {
  const t = SRDP.textTypes.find(x => x.id === typeId);
  const col = TYPE_COLORS[t.color];
  const quizzes = SRDP.quizzes[typeId] || [];
  const tab = typeTabs[typeId] || 'guide';
  const tabs = [
    ['guide', 'Guide'], ['model', 'Model text'], ['phrases', 'Phrases'],
  ];
  if (typeId === 'email') tabs.push(['subtypes', 'Sub-types']);
  tabs.push(['quiz', 'Quiz (' + quizzes.length + ')']);
  tabs.push(['dnd', 'Build the text']);

  let body = '';
  if (tab === 'guide') {
    body = sectionLabel('Layout') +
      '<div class="layout-box" style="border-left-color:' + col + '">' +
        t.layout.map(r => '<div><span class="part">' + esc(r.part) + '</span>' + (r.note ? '<span class="note">— ' + esc(r.note) + '</span>' : '') + '</div>').join('') +
      '</div><div class="gap-s"></div>' +
      sectionLabel('Do&rsquo;s and don&rsquo;ts') + ddCols(t.dos, t.donts) +
      (TYPE_EXAMPLES[typeId] ?
        '<div class="gap-s"></div>' +
        '<div class="acc"><div class="acc-item"><button class="acc-head" data-action="acc" aria-expanded="false"><span class="pm">+</span><span>See it in action: weaker vs. stronger</span></button>' +
        '<div class="acc-body">' +
          '<div class="grid g-2" style="margin-top:12px">' +
            '<div class="dd-col dont"><h3>Weaker</h3><p style="font-size:.9rem;line-height:1.55;color:var(--text-secondary);font-style:italic">&ldquo;' + esc(TYPE_EXAMPLES[typeId].weak) + '&rdquo;</p></div>' +
            '<div class="dd-col do"><h3>Stronger</h3><p style="font-size:.9rem;line-height:1.55;color:var(--text-secondary);font-style:italic">&ldquo;' + esc(TYPE_EXAMPLES[typeId].strong) + '&rdquo;</p></div>' +
          '</div>' +
          '<p style="font-size:.875rem;color:var(--text-muted);line-height:1.6;margin-top:14px"><strong style="color:var(--text)">Why it matters: </strong>' + esc(TYPE_EXAMPLES[typeId].why) + '</p>' +
        '</div></div></div>'
      : '') +
      '<div class="gap-s"></div>' +
      '<div class="tip" style="border-left-color:' + col + '"><strong>Key tip · </strong>' + esc(t.tip) + '</div>' +
      '<div class="gap-s"></div>' +
      '<div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +'<a class="btn btn-primary" href="pdf/' + typeId + '.pdf" target="_blank" rel="noopener">Download this guide (PDF) <span>&darr;</span></a>' +'<span style="font-size:.8125rem;color:var(--text-muted)">A clean, printable PDF of this whole guide, ready to revise from on paper.</span>' +'</div>';
  } else if (tab === 'model') {
    body = (typeId === 'blog' ? '<div class="tip" style="margin-bottom:16px">This model is a blog <strong>post</strong>. A blog <strong>comment</strong> works differently: no title, and the first sentence refers to the post it responds to (see the Key tip on the Guide tab).</div>' : '') + '<div style="margin-bottom:14px;font-size:1rem;color:var(--text)"><strong>' + esc(t.modelText.title) + '</strong></div>' + modelBox(t.modelText) + (SECOND_MODELS[typeId] ? secondModelBox(SECOND_MODELS[typeId]) : '');
  } else if (tab === 'phrases') {
    body = phraseGroups(t.phrases) +
      '<div style="font-size:.75rem;color:var(--text-muted);border-top:1px solid var(--border);padding-top:14px;letter-spacing:.32px">Click any phrase to copy it. The full searchable collection lives in the <a href="#phrasebank">phrase bank</a>.</div>';
  } else if (tab === 'subtypes' && typeId === 'email') {
    body = '<p style="font-size:.9375rem;color:var(--text-secondary);margin-bottom:20px;line-height:1.55">At B2, the e-mail task is almost always formal and falls into one of four sub-types. Open the one your task asks for; each comes with phrases and a model text.</p>' +
      '<div class="acc">' + SRDP.emailSubTypes.map(st =>
        '<div class="acc-item"><button class="acc-head" data-action="acc" aria-expanded="false"><span class="pm">+</span><span>' + st.name + '</span></button>' +
        '<div class="acc-body">' +
          '<p style="font-size:.9375rem;color:var(--text-secondary);margin:10px 0 18px;line-height:1.55">' + esc(st.purpose) + '</p>' +
          '<div class="layout-box" style="border-left-color:' + col + ';margin-bottom:18px;font-size:.8125rem;line-height:1.7">' + esc(st.layoutNotes) + '</div>' +
          ddCols(st.dos, st.donts) + '<div style="height:18px"></div>' +
          st.phrases.map(g => '<div style="margin-bottom:16px"><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:9px;letter-spacing:.32px">' + esc(g.category) + '</div>' + chips(g.items) + '</div>').join('') +
          '<div class="tip" style="border-left-color:' + col + ';margin-top:10px"><strong>Key tip · </strong>' + esc(st.tip) + '</div>' +
          (st.modelText
            ? '<div style="height:22px"></div><div style="font-size:.875rem;font-weight:600;margin-bottom:10px">Model text: ' + esc(st.modelText.title) + '</div>' + modelBox(st.modelText)
            : '<div style="margin-top:14px;font-size:.8125rem;color:var(--text-muted)">' + esc(st.modelNote || '') + '</div>') +
        '</div></div>').join('') +
      '</div>' +
      '<div class="gap-s"></div>' +
      '<div class="grid g-2">' +
        '<div class="card"><div style="font-weight:600;color:var(--blue);margin-bottom:6px">Dear Sir or Madam,</div><div>→ Yours faithfully,</div><div style="font-size:.75rem;color:var(--text-muted);margin-top:4px">Name unknown</div></div>' +
        '<div class="card"><div style="font-weight:600;color:var(--green);margin-bottom:6px">Dear Mr / Ms [Name],</div><div>→ Yours sincerely,</div><div style="font-size:.75rem;color:var(--text-muted);margin-top:4px">Name known</div></div>' +
      '</div>';
  } else if (tab === 'quiz') {
    body = '<div data-quiz-host="' + typeId + '"></div>';
  } else if (tab === 'dnd') {
    body = '<p style="font-size:.9375rem;color:var(--text-secondary);margin-bottom:18px;line-height:1.5">Put these sentences into the correct structural order. Drag them on a computer, or use the ▲▼ buttons on any device, including your phone.</p>' +
      '<div data-dnd-host="' + typeId + '"></div>';
  }

  return '<div class="page">' +
    '<div class="page-head"><div class="inner">' +
      '<div class="eyebrow"><span style="width:10px;height:10px;background:' + col + '"></span>Text type · ' + esc(t.badge) + '</div>' +
      '<h1 class="title">The ' + t.name.toLowerCase() + '</h1>' +
      '<p class="lead">' + esc(t.tagline) + '</p>' +
      '<div class="tabs">' + tabs.map(tb => '<button class="tab' + (tab === tb[0] ? ' active' : '') + '" data-action="type-tab" data-type="' + typeId + '" data-tab="' + tb[0] + '">' + tb[1] + '</button>').join('') + '</div>' +
    '</div></div>' +
    '<div class="wrap"><div class="gap-s"></div>' +
      '<div class="grid g-auto-150" style="margin-bottom:38px">' +
        t.quickFacts.map(f => '<div class="card" style="padding:15px 16px"><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:6px;letter-spacing:.32px">' + esc(f.label) + '</div><div style="font-size:.9375rem;font-weight:600">' + esc(f.value) + '</div></div>').join('') +
      '</div>' +
      body +
      '<div style="height:72px"></div>' +
    '</div>' +
  '</div>';
}
SRDP.textTypes.forEach(t => {
  PAGES[t.id] = {
    title: t.name, track: t.id,
    render() { return typePage(t.id); },
    wire() {
      const tab = typeTabs[t.id] || 'guide';
      if (tab === 'quiz') {
        if (!M.quizStates[t.id] || M.quizStates[t.id]._stale) M.initQuiz(t.id, SRDP.quizzes[t.id], (score, total) => { if (score >= Math.ceil(total * 0.6)) M.markQuiz(t.id); });
        const host = M.$('[data-quiz-host="' + t.id + '"]');
        if (host) host.innerHTML = M.quizHTML(t.id);
      }
      if (tab === 'dnd') {
        M.initDnd(t.id, SRDP.dndSets[t.id]);
        M.repaintDnd(t.id);
      }
    },
  };
});
window.MWG.typeTabs = typeTabs;
})();
</script>
<script>
/* ════════════════════════════════════════════════════════════
   Pages 2 — Phrase bank · Checklist · Self-check · Task bank
   ════════════════════════════════════════════════════════════ */
(function () {
'use strict';
const M = window.MWG;
const { esc, sectionLabel, pageHead, TYPE_COLORS } = M;

/* ─── PHRASE BANK ─────────────────────────────────────────── */
function allPhrases() {
  const out = [];
  SRDP.textTypes.forEach(t => t.phrases.forEach(g => g.items.forEach(p => out.push({ phrase: p, category: g.category, typeId: t.id, typeName: t.name, color: t.color }))));
  SRDP.emailSubTypes.forEach(st => st.phrases.forEach(g => g.items.forEach(p => out.push({ phrase: p, category: st.name + ' — ' + g.category, typeId: 'email', typeName: 'E-Mail', color: 'red' }))));
  SRDP.paragraphs.phraseGroups.forEach(g => g.phrases.forEach(p => out.push({ phrase: p, category: 'Paragraphs — ' + g.label, typeId: 'all', typeName: 'Any text', color: null })));
  return out;
}
const pbState = { search: '', filter: 'all' };
function pbList() {
  let r = allPhrases();
  if (pbState.filter !== 'all') r = r.filter(p => p.typeId === pbState.filter || p.typeId === 'all');
  if (pbState.search.trim()) {
    const q = pbState.search.toLowerCase();
    r = r.filter(p => p.phrase.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.typeName.toLowerCase().includes(q));
  }
  return r;
}
function pbResults() {
  const list = pbList();
  const grouped = {};
  list.forEach(p => { (grouped[p.category] = grouped[p.category] || []).push(p); });
  return '<div style="font-size:.8125rem;color:var(--text-muted);margin-bottom:18px">' + list.length + ' phrase' + (list.length !== 1 ? 's' : '') + ' found' + (pbState.search ? ' for &ldquo;' + esc(pbState.search) + '&rdquo;' : '') + '</div>' +
    (list.length === 0 ? '<div style="text-align:center;padding:48px;color:var(--text-muted)">No phrases match your search.</div>' :
      Object.keys(grouped).map(cat =>
        '<div style="margin-bottom:26px"><h2 class="section-label">' + esc(cat) + '</h2>' + M.chips(grouped[cat].map(p => p.phrase)) + '</div>').join(''));
}
PAGES.phrasebank = {
  title: 'Phrase bank', track: 'phrasebank',
  render() {
    const n = allPhrases().length;
    return '<div class="page">' +
      pageHead('Tool', 'Phrase bank', n + ' exam-ready phrases. Click any phrase to copy it instantly.') +
      '<div class="wrap"><div class="gap-s"></div>' +
        '<a class="btn btn-ghost no-print" href="pdf/phrase-bank.pdf" target="_blank" rel="noopener" style="margin-bottom:20px">Download this page as a PDF <span>&darr;</span></a>' +
        '<div class="field" style="max-width:420px;margin-bottom:18px"><label for="pbSearch">Search</label><input type="text" id="pbSearch" placeholder="Search phrases…" value="' + esc(pbState.search) + '"></div>' +
        '<div class="tabs" style="border-bottom:1px solid var(--border);margin-bottom:26px">' +
          [['all', 'All']].concat(SRDP.textTypes.map(t => [t.id, t.name])).map(f =>
            '<button class="tab' + (pbState.filter === f[0] ? ' active' : '') + '" data-action="pb-filter" data-f="' + f[0] + '">' + f[1] + '</button>').join('') +
        '</div>' +
        '<div id="pbResults">' + pbResults() + '</div>' +
        '<div style="height:72px"></div>' +
      '</div></div>';
  },
  wire() {
    const inp = M.$('#pbSearch');
    inp.addEventListener('input', () => { pbState.search = inp.value; M.$('#pbResults').innerHTML = pbResults(); });
  },
};
window.MWG.pbState = pbState;
window.MWG.pbResults = pbResults;

/* ─── WRITING CHECKLIST ───────────────────────────────────── */
const clState = { type: 'general', checks: {}, submitted: false };
function clItems() {
  const c = SRDP.checklists;
  return clState.type === 'general' ? c.general.items : c.general.items.concat(c[clState.type].items);
}
function clBody() {
  const c = SRDP.checklists;
  const items = clItems();
  const total = items.reduce((s, i) => s + i.weight, 0);
  const earned = items.filter(i => clState.checks[i.id]).reduce((s, i) => s + i.weight, 0);
  const score = Math.round((earned / total) * 100);
  const n = items.filter(i => clState.checks[i.id]).length;
  const bar = score >= 90 ? 'var(--green)' : score >= 70 ? 'var(--yellow)' : 'var(--primary)';
  const section = (title, list) =>
    '<div style="margin-bottom:26px"><h2 class="section-label">' + title + '</h2><div style="border:1px solid var(--border)">' +
    list.map(it => {
      const checked = !!clState.checks[it.id];
      const flagged = clState.submitted && !checked;

        '<span class="cl-box">' + (checked ? '✓' : '') + '</span>' +

const scState = { type: 'essay', target: 400 };
const CONTRACTIONS = /\b(don't|can't|won't|isn't|aren't|wasn't|weren't|doesn't|didn't|couldn't|shouldn't|wouldn't|hasn't|haven't|hadn't|it's|that's|there's|here's|what's|who's|let's|i'm|i've|i'll|i'd|you're|you've|you'll|you'd|we're|we've|we'll|we'd|they're|they've|they'll|she's|he's|she'll|he'll|gonna|wanna|gotta)\b/gi;
const INFORMAL = ['basically', 'stuff', 'guys', 'kids', 'loads of', 'lots of', 'a lot of', 'totally', 'awesome', 'cool', 'okay', 'ok', 'btw', 'huge', 'crazy', 'dumb', 'super', 'really really', 'kinda', 'sort of', 'pretty good', 'anyway'];
const LINKERS = ['furthermore', 'moreover', 'in addition', 'what is more', 'however', 'nevertheless', 'nonetheless', 'on the other hand', 'on the one hand', 'although', 'even though', 'despite', 'in spite of', 'therefore', 'consequently', 'as a result', 'thus', 'hence', 'owing to', 'due to', 'for instance', 'for example', 'admittedly', 'while', 'whereas', 'to sum up', 'on balance', 'in conclusion', 'taking everything into account', 'first of all', 'to begin with', 'in contrast', 'as a consequence', 'firstly', 'secondly', 'finally'];
const FORMAL_TYPES = { essay: true, report: true, email: true, article: false, blog: false };

function analyze(text, type, target) {
  const f = [];
  const add = (status, html) => f.push({ status, html });
  const words = text.match(/\S+/g) || [];
  const wc = words.length;
  const lo = Math.round(target * 0.9), hi = Math.round(target * 1.1);

  /* word count */
  if (wc === 0) return [{ status: 'bad', html: 'No text yet — paste your text above and press <b>Check my text</b>.' }];
  if (wc < lo) add('bad', '<b>' + wc + ' words</b> — below the safe range (' + lo + '–' + hi + ' for a ~' + target + '-word task). Develop your bullet points further.');
  else if (wc > hi) add('bad', '<b>' + wc + ' words</b> — above the safe range (' + lo + '–' + hi + '). Cut repetition and filler; more text = more error opportunities.');
  else add('ok', '<b>' + wc + ' words</b> — inside the safe range (' + lo + '–' + hi + '). ');

  /* paragraphs */
  const paras = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
  if (paras.length < 4) add('warn', '<b>' + paras.length + ' paragraph' + (paras.length === 1 ? '' : 's') + ' detected.</b> A Matura text usually needs 5–6 blocks (intro + one per bullet + conclusion). Separate paragraphs with an empty line.');
  else add('ok', '<b>' + paras.length + ' paragraphs</b> — structure looks deliberate.');

  /* register */
  const contr = text.match(CONTRACTIONS) || [];
  const informalHits = INFORMAL.filter(wrd => new RegExp('\\b' + wrd.replace(/ /g, '\\s+') + '\\b', 'i').test(text));
  if (FORMAL_TYPES[type]) {
    if (contr.length) add('bad', '<b>' + contr.length + ' contraction' + (contr.length > 1 ? 's' : '') + '</b> found (' + contr.slice(0, 5).map(c => '<code>' + esc(c) + '</code>').join(' ') + (contr.length > 5 ? ' …' : '') + ') — write the full forms in formal texts.');
    else add('ok', 'No contractions — correct for a formal text.');
    if (informalHits.length) add('warn', 'Possibly informal wording: ' + informalHits.slice(0, 6).map(w => '<code>' + esc(w) + '</code>').join(' ') + '. Replace with formal alternatives.');
  } else {
    add('info', (contr.length ? contr.length + ' contractions found — fine for a ' + type + '.' : 'No contractions found — for a ' + type + ', a personal, natural voice is welcome.'));
  }

  /* linkers */
  const found = LINKERS.filter(l => new RegExp('\\b' + l.replace(/ /g, '\\s+') + '\\b', 'i').test(text));
  if (found.length >= 5) add('ok', '<b>' + found.length + ' different linking devices</b> found: ' + found.slice(0, 8).map(l => '<code>' + esc(l) + '</code>').join(' ') + (found.length > 8 ? ' …' : ''));
  else add('warn', 'Only <b>' + found.length + ' B2 linking device' + (found.length === 1 ? '' : 's') + '</b> detected (' + (found.map(l => '<code>' + esc(l) + '</code>').join(' ') || 'none') + '). Aim for at least 5 different ones.');

  /* complex structures */
  const passive = (text.match(/\b(is|are|was|were|been|being|be)\s+\w+(ed|en)\b/gi) || []).length;
  const rel = (text.match(/\b(which|who|whose)\b/gi) || []).length;
  const cond = /\bif\b/i.test(text) && /\bwould\b/i.test(text);
  const signals = [];
  if (passive) signals.push(passive + '× possible passive');
  if (rel) signals.push(rel + '× relative pronoun (which/who/whose)');
  if (cond) signals.push('a conditional pattern (if … would)');
  if (signals.length >= 2) add('ok', '<b>Complex structures:</b> ' + signals.join(', ') + ' — good for your Range score. (Rough automatic estimate.)');
  else add('warn', '<b>Few complex structures detected</b> (' + (signals.join(', ') || 'none') + '). Work in a passive, a conditional or a relative clause — simple-only grammar caps your Range.');

  /* sentence stats */
  const sentences = text.replace(/\n+/g, ' ').split(/[.!?]+\s/).filter(s => s.trim().split(/\s+/).length > 2);
  if (sentences.length) {
    const lens = sentences.map(s => s.trim().split(/\s+/).length);
    const avg = Math.round(lens.reduce((a, b) => a + b, 0) / lens.length);
    const maxLen = Math.max.apply(null, lens), minLen = Math.min.apply(null, lens);
    if (maxLen - minLen < 8) add('warn', 'Sentence lengths are uniform (avg ' + avg + ' words, range ' + minLen + '–' + maxLen + '). Mix short, punchy sentences with longer complex ones.');
    else add('ok', 'Sentence variety: avg ' + avg + ' words, range ' + minLen + '–' + maxLen + ' — good rhythm.');
    const starters = {};
    sentences.forEach(s => { const w = (s.trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z']/g, ''); if (w) starters[w] = (starters[w] || 0) + 1; });
    const rep = Object.keys(starters).filter(w => starters[w] >= 4);
    if (rep.length) add('warn', 'Sentence starter repeated: ' + rep.map(w => '<code>' + esc(w) + '</code> (' + starters[w] + '×)').join(', ') + '. Vary your openings.');
  }

  /* questions / exclamations */
  const qs = (text.match(/\?/g) || []).length;
  const ex = (text.match(/!/g) || []).length;
  if (type === 'essay' && qs > 1) add('warn', qs + ' question marks — in an essay, at most one rhetorical question (in the introduction).');
  if ((type === 'article' || type === 'blog') && qs === 0) add('warn', 'No rhetorical questions — articles and blogs should engage the reader directly.');
  if (FORMAL_TYPES[type] && ex > 0) add('bad', ex + ' exclamation mark' + (ex > 1 ? 's' : '') + ' — not appropriate in a formal ' + type + '.');

  /* type-specific structure */
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (type === 'email') {
    const hasHeader = /to\s*:/i.test(text) && /from\s*:/i.test(text) && /subject\s*:/i.test(text) && /date\s*:/i.test(text);
    add(hasHeader ? 'ok' : 'bad', hasHeader ? 'Header complete (To / From / Date / Subject).' : '<b>Header incomplete</b> — a formal e-mail needs To, From, Date AND Subject lines.');
    const dearSir = /dear\s+(sir|madam|editor)/i.test(text);
    const dearName = /dear\s+(mr|ms|mrs|dr)\.?\s+\w+/i.test(text);
    const faith = /yours\s+faithfully/i.test(text);
    const sinc = /yours\s+sincerely/i.test(text);
    if (!dearSir && !dearName) add('bad', 'No formal greeting found — open with <code>Dear Sir or Madam,</code> or <code>Dear Mr/Ms [Name],</code>.');
    if (!faith && !sinc) add('bad', 'No sign-off found — close with <code>Yours faithfully,</code> (name unknown) or <code>Yours sincerely,</code> (name known).');
    if (dearSir && sinc) add('bad', '<b>Mismatch:</b> "Dear Sir or Madam" must pair with <code>Yours faithfully</code>, not "sincerely".');
    if (dearName && faith) add('bad', '<b>Mismatch:</b> a named greeting (Dear Mr/Ms …) must pair with <code>Yours sincerely</code>.');
    if ((dearSir && faith) || (dearName && sinc)) add('ok', 'Greeting and sign-off match correctly.');
  }
  if (type === 'report') {
    const hasHeader = /from\s*:/i.test(text) && /subject\s*:/i.test(text) && /date\s*:/i.test(text);
    add(hasHeader ? 'ok' : 'bad', hasHeader ? 'Header complete (Date / From / Subject).' : '<b>Header incomplete</b> — a report needs Date, From and Subject lines.');
    const headings = lines.filter(l => /^\d+[\.\)]\s+\S/.test(l)).length;
    add(headings >= 3 ? 'ok' : 'bad', headings >= 3 ? headings + ' numbered section headings found.' : '<b>Only ' + headings + ' numbered heading' + (headings === 1 ? '' : 's') + '</b> — every report section needs one (1. Introduction, 2. Findings, …).');
    if (/dear\s+(sir|madam)/i.test(text)) add('bad', 'Reports have <b>no greeting</b> — delete "Dear Sir or Madam".');
    const opinion = (text.match(/\bI (think|believe|feel)\b/gi) || []).length;
    if (opinion > 1) add('warn', '"I think/believe/feel" appears ' + opinion + '× — keep opinion out of the body; only the recommendations may carry careful suggestions.');
  }
  if (type === 'essay' || type === 'article') {
    const first = lines[0] || '';
    const looksTitle = first.length > 0 && first.split(/\s+/).length <= 12 && !/[.:!?,]$/.test(first) && !/^(dear|to:|from:)/i.test(first);
    add(looksTitle ? 'ok' : 'warn', looksTitle ? 'First line looks like a title: <code>' + esc(first) + '</code>' : 'No title detected — ' + (type === 'essay' ? 'essays need a clear title on the first line.' : 'articles need a catchy title on the first line.'));
  }
  if (type === 'blog') {
    add('info', 'Blog post: username + date/time at the top, catchy title, and an invitation to comment at the end. Blog comment: NO title — reference the original post in sentence one.');
    if (!/\?/.test(text)) add('warn', 'Consider ending with a question to invite comments.');
  }
  if (type === 'essay') {
    const anecdote = (text.match(/\b(my|me|I was|when I)\b/gi) || []).length;
    if (anecdote > 6) add('warn', 'Lots of first-person/personal phrasing — essays argue with generalisations, not personal stories. ("It is often the case that…" instead of "When I was…")');
  }
  add('info', 'This is a quick robot check of the surface. It cannot judge your ideas or your accuracy; for real feedback, use the AI prompt below or ask your teacher.');
  return f;
}
