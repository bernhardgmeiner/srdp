<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<!-- Interne Vorlage für og-image.png. Mit Playwright bei 1200×630 screenshotten:
     node _dev/make-og.mjs  (nach Änderungen hier neu ausführen) -->
<style>
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:300;src:url('fonts/ibm-plex-sans-latin-300-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;src:url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;src:url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f4f1ea;font-family:'IBM Plex Sans',Arial,sans-serif;position:relative;overflow:hidden}
.card{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
.m{width:120px;height:120px;background:#0f62fe;display:flex;align-items:center;justify-content:center;margin-bottom:56px}
.m span{font-family:Georgia,serif;font-size:76px;color:#ffffff;line-height:1;transform:translateY(-2px)}
h1{font-weight:600;font-size:64px;line-height:1.12;color:#161616;letter-spacing:-.5px;max-width:980px}
.sub{margin-top:26px;font-weight:400;font-size:30px;color:#525252;letter-spacing:.1px}
.url{position:absolute;right:80px;bottom:56px;font-size:24px;font-weight:400;color:#6f6f6f;letter-spacing:.2px}
.rule{position:absolute;left:80px;bottom:56px;width:64px;height:4px;background:#0f62fe}
</style>
</head>
<body>
<div class="card">
  <div class="m"><span>M</span></div>
  <h1>Don&rsquo;t panic, it&rsquo;s just the Matura.</h1>
  <div class="sub">The free B2 writing guide for the English Matura (AHS)</div>
</div>
<div class="rule"></div>
<div class="url">matura.bernhardgmeiner.com</div>
</body>
</html>
